name: Build VoiceLoop Android APK (Gemini Free Tier)

on:
  workflow_dispatch:
  push:
    paths:
      - 'voice-loop-source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p work
          unzip -q voice-loop-source.zip -d work
          test -f work/VoiceLoopAndroidProject/settings.gradle.kts
          test -f work/VoiceLoopAndroidProject/app/src/main/java/com/example/voiceloop/VoiceLoopService.java

      - name: Build debug APK
        working-directory: work/VoiceLoopAndroidProject
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceLoop-Gemini-debug-apk
          path: work/VoiceLoopAndroidProject/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
